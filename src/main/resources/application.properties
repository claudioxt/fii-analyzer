spring.application.name=fii-analyzer

# DataSource — PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fii_analyzer}
spring.datasource.username=${DB_USERNAME:fii_user}
spring.datasource.password=${DB_PASSWORD:fii_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Init (Spring Boot 4 — substitui Flyway)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Cache
spring.cache.type=caffeine

# Timezone
spring.jackson.time-zone=America/Sao_Paulo

# Anthropic Claude API
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Swagger UI — carrega o openapi.yml estático em vez de gerar pela anotações
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/swagger/openapi.yml
springdoc.api-docs.enabled=false

# Análise FII — Yahoo Finance (sem autenticação necessária)
# chart:   https://query1.finance.yahoo.com/v8/finance/chart/{TICKER}.SA
# summary: https://query1.finance.yahoo.com/v11/finance/quoteSummary/{TICKER}.SA

# JWT
jwt.secret=${JWT_SECRET:ZmlpQW5hbHl6ZXJTZWNyZXRLZXlGb3JKV1QyMDI2UHJvZA==}
jwt.expiration=${JWT_EXPIRATION:86400000}
